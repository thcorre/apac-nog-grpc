name: srl-gribi

mgmt:
  network: srl-gribi-lab-mgmt
  ipv4-subnet: 172.30.30.0/24
  ipv6-subnet: 2001:172:30:30::/64

prefix: ""
topology:
  defaults:
    kind: nokia_srlinux
  kinds:
    nokia_srlinux:
      type: ixrd2l
      image: ghcr.io/nokia/srlinux:24.10.1
    linux:
      image: ghcr.io/srl-labs/network-multitool
  nodes:
    leaf1:
      startup-config: configs/leaf1.txt
      mgmt-ipv4: 172.30.30.2
      mgmt-ipv6: 2001:172:30:30::2
    leaf2:
      startup-config: configs/leaf2.txt
      mgmt-ipv4: 172.30.30.4
      mgmt-ipv6: 2001:172:30:30::4
    spine:
      startup-config: configs/spine.txt
      type: ixrx3b
      license: license-srlinux24.txt
      mgmt-ipv4: 172.30.30.3
      mgmt-ipv6: 2001:172:30:30::3
    client1:
      kind: linux
      mgmt-ipv4: 172.30.30.10
      mgmt-ipv6: 2001:172:30:30::10
      exec:
        - ip address add 172.16.10.50/24 dev eth1
        - ip -6 address add 172:16:10::50/64 dev eth1
        - ip route add 10.90.1.0/24 via 172.16.10.254
        - ip route add 10.80.1.0/24 via 172.16.10.254
        - ip -6 route add 10:90:1::/64 via 172:16:10::254
        - ip -6 route add 10:80:1::/64 via 172:16:10::254
    client2:
      kind: linux
      mgmt-ipv4: 172.30.30.11
      mgmt-ipv6: 2001:172:30:30::11
      exec:
        - ip address add 10.80.1.1/24 dev eth1
        - ip -6 address add 10:80:1::1/64 dev eth1
        - ip route add 10.90.1.0/24 via 10.80.1.2
        - ip route add 172.16.10.0/24 via 10.80.1.2
        - ip -6 route add 10:90:1::/64 via 10:80:1::2
    client3:
      kind: linux
      mgmt-ipv4: 172.30.30.12
      mgmt-ipv6: 2001:172:30:30::12
      exec:
        - ip address add 172.16.10.60/24 dev eth1
        - ip -6 address add 172:16:10::60/64 dev eth1
        - ip route add 10.90.1.0/24 via 172.16.10.253
        - ip route add 10.80.1.0/24 via 172.16.10.253
        - ip -6 route add 10:90:1::/64 via 172:16:10::253
        - ip -6 route add 10:80:1::/64 via 172:16:10::253
    client4:
      kind: linux
      mgmt-ipv4: 172.30.30.13
      mgmt-ipv6: 2001:172:30:30::13
      exec:
        - ip address add 10.90.1.1/24 dev eth1
        - ip -6 address add 10:90:1::1/64 dev eth1
        - ip route add 10.80.1.0/24 via 10.90.1.2
        - ip route add 172.16.10.0/24 via 10.90.1.2
        - ip -6 route add 10:80:1::/64 via 10:90:1::2
  links:
      # spine-leaf links
    - endpoints: ["leaf1:e1-1", "spine:e1-1"]
    - endpoints: ["leaf2:e1-2", "spine:e1-2"]
    
      # leaf-client links
    - endpoints: ["client1:eth1","leaf1:e1-10"]
    - endpoints: ["client2:eth1","leaf1:e1-11"]
    - endpoints: ["client3:eth1","leaf2:e1-10"]
    - endpoints: ["client4:eth1","leaf2:e1-11"]
